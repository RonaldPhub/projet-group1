<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Hôtel</title>
    <link rel="stylesheet" href="contact.css">
</head>

<body>

    <div class="container">

        <h1>Contactez-nous</h1>

        <!-- FORMULAIRE -->
        <form action="#" method="POST">
            <input type="text" name="nom" placeholder="Votre nom" required>
            <input type="email" name="email" placeholder="Votre email" required>
            <input type="text" name="telephone" placeholder="Votre numéro de téléphone" required>
            <input type="text" name="adresse" placeholder="Votre adresse complète">

            <textarea name="message" placeholder="Votre message..." required></textarea>

            <button type="submit">Envoyer</button>
        </form>

        <!-- Contact hôtel -->
        <div class="info">
            <h2>Informations de l'hôtel</h2>
            <p><strong>Téléphone :</strong> +33 1 23 45 67 89</p>
            <p><strong>Email :</strong> contact@hotel-exemple.com</p>
        </div>

       <!-- Localisation de l'hôtel -->
        <div class="map">
            <h2>Localisation</h2>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2624.9994311372925!2d2.294481315674568!3d48.85837007928792!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e66fddf9e13b2d%3A0x4d50c044ae01!2sTour%20Eiffel!5e0!3m2!1sfr!2sfr!4v1675938461839"
                width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy">
            </iframe>
        </div>

    </div>

</body>

</html>
