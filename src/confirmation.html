<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmation de réservation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">
<h2 class="text-center mb-4 titre">Confirmation de votre réservation</h2>

<div class="card-confirm shadow">
    <h4 class="mb-3">🛏️ Chambre réservée :</h4>
    <p id="chambre" class="fw-bold"></p>

    <h4 class="mt-4 mb-3">📅 Dates :</h4>
    <p id="dates"></p>

    <h4 class="mt-4 mb-3">💶 Total :</h4>
    <p id="total" class="fw-bold"></p>

    <div class="text-center mt-4">
        <a href="index.html" class="btn-retour">Retour à l'accueil</a>
        <button class="btn-pdf" onclick="telechargerPDF()">Télécharger le récapitulatif en PDF</button>
    </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const chambre = localStorage.getItem("chambre") || "Non renseigné";
const dates   = localStorage.getItem("dates") || "Non renseigné";
const total   = localStorage.getItem("total") ? localStorage.getItem("total")+" €" : "Non renseigné";

document.getElementById("chambre").innerText = chambre;
document.getElementById("dates").innerText = dates;
document.getElementById("total").innerText = total;

function telechargerPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(18);
    doc.text("Récapitulatif de réservation", 20, 20);
    doc.setFontSize(14);
    doc.text(`Chambre : ${chambre}`, 20, 40);
    doc.text(`Dates : ${dates}`, 20, 55);
    doc.text(`Montant total : ${total}`, 20, 70);
    doc.text("Merci pour votre réservation à l'hôtel de l'Europe.", 20, 100);
    doc.save("recapitulatif_reservation.pdf");
}
</script>
</body>
</html>
